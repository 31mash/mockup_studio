70" fill="#dfe9ef"/><circle cx="1798.37" cy="342.65" r="4.70" fill="#dfe9ef"/><circle cx="1779.56" cy="342.65" r="4.70" fill="#dfe9ef"/><circle cx="1760.76" cy="342.65" r="4.70" fill="#dfe9ef"/><circle cx="1798.37" cy="361.46" r="4.70" fill="#dfe9ef"/><circle cx="1798.37" cy="380.27" r="4.70" fill="#dfe9ef"/><text x="1605.4" y="469.0" font-family="Comfortaa" font-weight="500" font-size="90.0" fill="#a2c940" text-anchor="start" letter-spacing="-2.25">Stick Man</text><text x="1605.4" y="525.0" font-family="Comfortaa" font-weight="500" font-size="41.0" fill="#a2c940" text-anchor="start">Potato Sticks Salted</text><rect x="2049.4" y="490.5" width="34.0" height="34.0" fill="#ffffff"/><rect x="2052.46" y="493.56" width="27.88" height="27.88" fill="none" stroke="#0d9447" stroke-width="3.4000000000000004"/><circle cx="2066.4" cy="507.5" r="8.16" fill="#0d9447"/><text x="1605.4" y="592.0" font-family="Comfortaa" font-weight="500" font-size="31.5" fill="#95cbe8" text-anchor="start">Stick man, stick man</text><text x="1605.4" y="638.5" font-family="Comfortaa" font-weight="500" font-size="31.5" fill="#95cbe8" text-anchor="start">marching side by side</text><text x="1605.4" y="685.0" font-family="Comfortaa" font-weight="500" font-size="31.5" fill="#95cbe8" text-anchor="start">Stick man, stick man</text><text x="1605.4" y="731.5" font-family="Comfortaa" font-weight="500" font-size="31.5" fill="#95cbe8" text-anchor="start">got nowhere to hide</text><text x="1605.4" y="778.0" font-family="Comfortaa" font-weight="500" font-size="31.5" fill="#95cbe8" text-anchor="start">Eat his left arm</text><text x="1605.4" y="824.5" font-family="Comfortaa" font-weight="500" font-size="31.5" fill="#95cbe8" text-anchor="start">and the right one too</text><text x="1605.4" y="871.0" font-family="Comfortaa" font-weight="500" font-size="31.5" fill="#95cbe8" text-anchor="start">When he comes to his senses</text><text x="1605.4" y="917.5" font-family="Comfortaa" font-weight="500" font-size="31.5" fill="#95cbe8" text-anchor="start">he won’t know what to do</text><text x="1605.4" y="964.0" font-family="Comfortaa" font-weight="500" font-size="31.5" fill="#95cbe8" text-anchor="start">He’ll run and run</text><text x="1605.4" y="1010.5" font-family="Comfortaa" font-weight="500" font-size="31.5" fill="#95cbe8" text-anchor="start">but there’s no place to flee</text><text x="1605.4" y="1057.0" font-family="Comfortaa" font-weight="500" font-size="31.5" fill="#95cbe8" text-anchor="start">Gobble up his left leg</text><text x="1605.4" y="1103.5" font-family="Comfortaa" font-weight="500" font-size="31.5" fill="#95cbe8" text-anchor="start">and lick your lips with glee</text><text x="1605.4" y="1161.0" font-family="Comfortaa" font-weight="500" font-size="20.0" fill="#dedde8" text-anchor="start">Ingredients: Potatoes (88%), Edible Vegetable Oil, Iodised Salt and Antioxidant (319).</text><text x="1605.4" y="1194.0" font-family="Comfortaa" font-weight="500" font-size="20.0" fill="#dedde8" text-anchor="start">Contains sulphites. Made in India. Exclusively produced for IndiGo.</text><text x="1605.4" y="1227.0" font-family="Comfortaa" font-weight="500" font-size="20.0" fill="#dedde8" text-anchor="start">For complaints and feedback, write to us at goIndiGo.in</text><g transform="translate(1042.8 1100.0) rotate(-90)"><text x="0.0" y="22.0" font-family="Comfortaa" font-weight="700" font-size="15.0" fill="#dedde8" text-anchor="start" letter-spacing="0.40">NUTRITIONAL FACTS</text><text x="0.0" y="47.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#dedde8" text-anchor="start">Stick Man Salted Potato Sticks</text><text x="0.0" y="72.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#dedde8" text-anchor="start">Values per 100 g (approx.)</text><text x="0.0" y="110.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#dedde8" text-anchor="start">Energy (kcal)</text><text x="253.0" y="110.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#dedde8" text-anchor="end">543</text><text x="0.0" y="135.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#dedde8" text-anchor="start">Total Fat (g)</text><text x="253.0" y="135.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#dedde8" text-anchor="end">34.5</text><text x="0.0" y="160.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#dedde8" text-anchor="start">Cholesterol (mg)</text><text x="253.0" y="160.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#dedde8" text-anchor="end">0</text><text x="0.0" y="185.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#dedde8" text-anchor="start">Total Carbohydrate (g)</text><text x="253.0" y="185.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#dedde8" text-anchor="end">50.2</text><text x="0.0" y="210.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#dedde8" text-anchor="start">of which Sugars (g)</text><text x="253.0" y="210.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#dedde8" text-anchor="end">0.5</text><text x="0.0" y="235.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#dedde8" text-anchor="start">Protein (g)</text><text x="253.0" y="235.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#dedde8" text-anchor="end">6.8</text><text x="0.0" y="260.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#dedde8" text-anchor="start">Dietary Fibre (g)</text><text x="253.0" y="260.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#dedde8" text-anchor="end">4.4</text><line x1="265.0" y1="5.0" x2="265.0" y2="285.0" stroke="#dedde8" stroke-width="1.4"/><text x="283.0" y="22.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#dedde8" text-anchor="start">Net weight: 50 g</text><text x="283.0" y="47.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#dedde8" text-anchor="start">MRP: Rs. 50.00</text><text x="283.0" y="72.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#dedde8" text-anchor="start">(incl. of all taxes)</text><text x="283.0" y="110.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#dedde8" text-anchor="start">Best before 6 months from</text><text x="283.0" y="135.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#dedde8" text-anchor="start">the date of manufacture.</text><text x="283.0" y="160.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#dedde8" text-anchor="start">Store in a cool, dry place.</text><text x="283.0" y="235.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#dedde8" text-anchor="start">Exclusively produced</text><text x="283.0" y="260.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#dedde8" text-anchor="start">for IndiGo.</text><path d="M504.0 127.6 A13.0 13.0 0 0 1 513.0 140.5" fill="none" stroke="#dedde8" stroke-width="2.8" stroke-linecap="round"/><path d="M512.8 147.2 L518.3 140.6 L507.7 140.3 Z" fill="#dedde8"/><path d="M508.7 149.7 A13.0 13.0 0 0 1 493.1 151.0" fill="none" stroke="#dedde8" stroke-width="2.8" stroke-linecap="round"/><path d="M487.4 147.5 L490.3 155.5 L495.9 146.5 Z" fill="#dedde8"/><path d="M487.3 142.7 A13.0 13.0 0 0 1 493.9 128.5" fill="none" stroke="#dedde8" stroke-width="2.8" stroke-linecap="round"/><path d="M499.8 125.4 L491.4 123.8 L496.4 133.2 Z" fill="#dedde8"/></g></g></defs><rect width="2293.4" height="1312.0" fill="#3c3b5c"/><use href="#label" x="-2293.4"/><use href="#label"/><use href="#label" x="2293.4"/></svg>