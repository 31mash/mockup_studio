xt-anchor="start">Potato Sticks Masala</text><rect x="2705.7" y="490.5" width="34.0" height="34.0" fill="#ffffff"/><rect x="2708.7599999999998" y="493.56" width="27.88" height="27.88" fill="none" stroke="#0d9447" stroke-width="3.4000000000000004"/><circle cx="2722.7" cy="507.5" r="8.16" fill="#0d9447"/><text x="2242.4" y="592.0" font-family="Comfortaa" font-weight="500" font-size="31.5" fill="#ffd68a" text-anchor="start">Stick man stick man</text><text x="2242.4" y="638.5" font-family="Comfortaa" font-weight="500" font-size="31.5" fill="#ffd68a" text-anchor="start">marching side by side</text><text x="2242.4" y="685.0" font-family="Comfortaa" font-weight="500" font-size="31.5" fill="#ffd68a" text-anchor="start">Stick man stick man</text><text x="2242.4" y="731.5" font-family="Comfortaa" font-weight="500" font-size="31.5" fill="#ffd68a" text-anchor="start">Got nowhere to hide</text><text x="2242.4" y="778.0" font-family="Comfortaa" font-weight="500" font-size="31.5" fill="#ffd68a" text-anchor="start">Eat his left arm</text><text x="2242.4" y="824.5" font-family="Comfortaa" font-weight="500" font-size="31.5" fill="#ffd68a" text-anchor="start">And the right one too</text><text x="2242.4" y="871.0" font-family="Comfortaa" font-weight="500" font-size="31.5" fill="#ffd68a" text-anchor="start">When he comes to his senses</text><text x="2242.4" y="917.5" font-family="Comfortaa" font-weight="500" font-size="31.5" fill="#ffd68a" text-anchor="start">He won’t know what to do</text><text x="2242.4" y="964.0" font-family="Comfortaa" font-weight="500" font-size="31.5" fill="#ffd68a" text-anchor="start">He’ll run and run</text><text x="2242.4" y="1010.5" font-family="Comfortaa" font-weight="500" font-size="31.5" fill="#ffd68a" text-anchor="start">But there’s no place to flee</text><text x="2242.4" y="1057.0" font-family="Comfortaa" font-weight="500" font-size="31.5" fill="#ffd68a" text-anchor="start">Gobble up his left leg</text><text x="2242.4" y="1103.5" font-family="Comfortaa" font-weight="500" font-size="31.5" fill="#ffd68a" text-anchor="start">And lick your lips with glee</text><text x="2242.4" y="1161.0" font-family="Comfortaa" font-weight="500" font-size="20.0" fill="#fde7ee" text-anchor="start">Ingredients: Potatoes (85%), Edible Vegetable Oil, Masala Seasoning (5%) [Spices and Condiments, Sugar, Onion and Garlic Powder], Edible Common Salt, Acidity Regulator (330)</text><text x="2242.4" y="1194.0" font-family="Comfortaa" font-weight="500" font-size="20.0" fill="#fde7ee" text-anchor="start">and Antioxidant (319). CONTAINS ADDED FLAVOURS – NATURAL AND NATURE IDENTICAL FLAVOURING SUBSTANCES. Contains sulphites. Made in India.</text><text x="2242.4" y="1227.0" font-family="Comfortaa" font-weight="500" font-size="20.0" fill="#fde7ee" text-anchor="start">Exclusively produced for IndiGo. For complaints and feedback, write to us at goIndiGo.in</text><g transform="translate(1860.2 1100.0) rotate(-90)"><text x="0.0" y="22.0" font-family="Comfortaa" font-weight="700" font-size="15.0" fill="#fde7ee" text-anchor="start" letter-spacing="0.40">NUTRITIONAL FACTS</text><text x="0.0" y="47.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#fde7ee" text-anchor="start">Stick Man Masala Potato Sticks</text><text x="0.0" y="72.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#fde7ee" text-anchor="start">Values per 100 g (approx.)</text><text x="0.0" y="110.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#fde7ee" text-anchor="start">Energy (kcal)</text><text x="253.0" y="110.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#fde7ee" text-anchor="end">538</text><text x="0.0" y="135.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#fde7ee" text-anchor="start">Total Fat (g)</text><text x="253.0" y="135.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#fde7ee" text-anchor="end">33.2</text><text x="0.0" y="160.0" font-family="Comfortaa" font-weight="