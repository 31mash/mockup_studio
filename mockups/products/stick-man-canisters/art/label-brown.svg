rm="rotate(31.00 2633.6 298.0)"/><rect x="2764.4" y="228.5" width="18.5" height="139.0" rx="8.5" fill="#f0a646" transform="rotate(-31.00 2773.6 298.0)"/><rect x="2634.4" y="377.5" width="18.5" height="141.0" rx="8.5" fill="#f0a646" transform="rotate(31.00 2643.6 448.0)"/><rect x="2754.4" y="377.5" width="18.5" height="141.0" rx="8.5" fill="#f0a646" transform="rotate(-31.00 2763.6 448.0)"/><circle cx="885.54" cy="270.25" r="4.70" fill="#d9e9f0"/><circle cx="904.35" cy="270.25" r="4.70" fill="#d9e9f0"/><circle cx="923.16" cy="270.25" r="4.70" fill="#d9e9f0"/><circle cx="941.96" cy="270.25" r="4.70" fill="#d9e9f0"/><circle cx="960.77" cy="270.25" r="4.70" fill="#d9e9f0"/><circle cx="960.77" cy="289.06" r="4.70" fill="#d9e9f0"/><circle cx="960.77" cy="307.86" r="4.70" fill="#d9e9f0"/><circle cx="960.77" cy="326.67" r="4.70" fill="#d9e9f0"/><circle cx="960.77" cy="345.48" r="4.70" fill="#d9e9f0"/><circle cx="974.12" cy="256.90" r="4.70" fill="#d9e9f0"/><circle cx="987.29" cy="243.73" r="4.70" fill="#d9e9f0"/><circle cx="941.96" cy="289.06" r="4.70" fill="#d9e9f0"/><circle cx="928.80" cy="302.60" r="4.70" fill="#d9e9f0"/><circle cx="915.26" cy="315.95" r="4.70" fill="#d9e9f0"/><circle cx="902.09" cy="329.11" r="4.70" fill="#d9e9f0"/><circle cx="889.31" cy="342.65" r="4.70" fill="#d9e9f0"/><circle cx="870.50" cy="342.65" r="4.70" fill="#d9e9f0"/><circle cx="851.69" cy="342.65" r="4.70" fill="#d9e9f0"/><circle cx="889.31" cy="361.46" r="4.70" fill="#d9e9f0"/><circle cx="889.31" cy="380.27" r="4.70" fill="#d9e9f0"/><text x="696.3" y="469.0" font-family="Comfortaa" font-weight="500" font-size="90.0" fill="#a6d6ef" text-anchor="start" letter-spacing="-2.25">Stick Man</text><text x="696.3" y="525.0" font-family="Comfortaa" font-weight="500" font-size="41.0" fill="#d4e7ee" text-anchor="start">Potato Sticks Tomato</text><rect x="1162.5" y="490.5" width="34.0" height="34.0" fill="#ffffff"/><rect x="1165.56" y="493.56" width="27.88" height="27.88" fill="none" stroke="#0d9447" stroke-width="3.4000000000000004"/><circle cx="1179.5" cy="507.5" r="8.16" fill="#0d9447"/><text x="696.3" y="592.0" font-family="Comfortaa" font-weight="500" font-size="31.5" fill="#a4c841" text-anchor="start">Stick man, stick man</text><text x="696.3" y="638.5" font-family="Comfortaa" font-weight="500" font-size="31.5" fill="#a4c841" text-anchor="start">marching side by side</text><text x="696.3" y="685.0" font-family="Comfortaa" font-weight="500" font-size="31.5" fill="#a4c841" text-anchor="start">Stick man, stick man</text><text x="696.3" y="731.5" font-family="Comfortaa" font-weight="500" font-size="31.5" fill="#a4c841" text-anchor="start">got nowhere to hide</text><text x="696.3" y="778.0" font-family="Comfortaa" font-weight="500" font-size="31.5" fill="#a4c841" text-anchor="start">Eat his left arm</text><text x="696.3" y="824.5" font-family="Comfortaa" font-weight="500" font-size="31.5" fill="#a4c841" text-anchor="start">and the right one too</text><text x="696.3" y="871.0" font-family="Comfortaa" font-weight="500" font-size="31.5" fill="#a4c841" text-anchor="start">When he comes to his senses</text><text x="696.3" y="917.5" font-family="Comfortaa" font-weight="500" font-size="31.5" fill="#a4c841" text-anchor="start">he won’t know what to do</text><text x="696.3" y="964.0" font-family="Comfortaa" font-weight="500" font-size="31.5" fill="#a4c841" text-anchor="start">He’ll run and run</text><text x="696.3" y="1010.5" font-family="Comfortaa" font-weight="500" font-size="31.5" fill="#a4c841" text-anchor="start">but there’s no place to flee</text><text x="696.3" y="1057.0" font-family="Comfortaa" font-weight="500" font-size="31.5" fill="#a4c841" text-anchor="start">Gobble up his left leg</text><text x="696.3" y="1103.5" font-family="Comfortaa" font-weight="500" font-size="31.5" fill="#a4c841" text-anchor="start">and lick your lips with glee</text><text x="696.3" y="1161.0" font-family="Comfortaa" font-weight="500" font-size="20.0" fill="#eadccf" text-anchor="start">Ingredients: Potatoes (86%), Edible Vegetable Oil, Tomato Powder (1.4%), Sugar, Iodised Salt, Spices and Condiments, Acidity Regulator (330)</text><text x="696.3" y="1194.0" font-family="Comfortaa" font-weight="500" font-size="20.0" fill="#eadccf" text-anchor="start">and Antioxidant (319). CONTAINS ADDED FLAVOURS – NATURAL AND NATURE IDENTICAL FLAVOURING SUBSTANCES. Contains sulphites.</text><text x="696.3" y="1227.0" font-family="Comfortaa" font-weight="500" font-size="20.0" fill="#eadccf" text-anchor="start">Made in India. Exclusively produced for IndiGo. For complaints and feedback, write to us at goIndiGo.in</text><g transform="translate(2140.5 1100.0) rotate(-90)"><text x="0.0" y="22.0" font-family="Comfortaa" font-weight="700" font-size="15.0" fill="#eadccf" text-anchor="start" letter-spacing="0.40">NUTRITIONAL FACTS</text><text x="0.0" y="47.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#eadccf" text-anchor="start">Stick Man Tomato Potato Sticks</text><text x="0.0" y="72.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#eadccf" text-anchor="start">Values per 100 g (approx.)</text><text x="0.0" y="110.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#eadccf" text-anchor="start">Energy (kcal)</text><text x="253.0" y="110.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#eadccf" text-anchor="end">541</text><text x="0.0" y="135.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#eadccf" text-anchor="start">Total Fat (g)</text><text x="253.0" y="135.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#eadccf" text-anchor="end">33.8</text><text x="0.0" y="160.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#eadccf" text-anchor="start">Cholesterol (mg)</text><text x="253.0" y="160.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#eadccf" text-anchor="end">0</text><text x="0.0" y="185.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#eadccf" text-anchor="start">Total Carbohydrate (g)</text><text x="253.0" y="185.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#eadccf" text-anchor="end">52.6</text><text x="0.0" y="210.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#eadccf" text-anchor="start">of which Sugars (g)</text><text x="253.0" y="210.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#eadccf" text-anchor="end">2.1</text><text x="0.0" y="235.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#eadccf" text-anchor="start">Protein (g)</text><text x="253.0" y="235.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#eadccf" text-anchor="end">6.4</text><text x="0.0" y="260.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#eadccf" text-anchor="start">Dietary Fibre (g)</text><text x="253.0" y="260.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#eadccf" text-anchor="end">4.2</text><line x1="265.0" y1="5.0" x2="265.0" y2="285.0" stroke="#eadccf" stroke-width="1.4"/><text x="283.0" y="22.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#eadccf" text-anchor="start">Net weight: 50 g</text><text x="283.0" y="47.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#eadccf" text-anchor="start">MRP: Rs. 50.00</text><text x="283.0" y="72.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#eadccf" text-anchor="start">(incl. of all taxes)</text><text x="283.0" y="110.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#eadccf" text-anchor="start">Best before 6 months from</text><text x="283.0" y="135.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#eadccf" text-anchor="start">the date of manufacture.</text><text x="283.0" y="160.0" font-family="Comfortaa" font-weight="500" font-size="15.0" fill="#eadccf" text-anchor="start">Store in a cool, dry place.</text><text 