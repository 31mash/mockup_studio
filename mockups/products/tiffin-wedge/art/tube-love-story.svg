<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4193 700" data-width="12288"><g transform="matrix(0,1,-1,0,4814.53,0)"><rect x="-40" y="-40" width="780.0" height="1309.6899458456871" fill="#e9692e"/><text x="60.0" y="180.0" font-family="Comfortaa" font-weight="700" font-size="70.0" fill="#fffcf3" text-anchor="start" >Tiffin</text><rect x="570.0" y="118" width="70" height="70" fill="#ffffff"/><rect x="576.3" y="124.3" width="57.4" height="57.4" fill="none" stroke="#0d9447" stroke-width="7.0"/><circle cx="605.0" cy="153.0" r="16.8" fill="#0d9447"/><text x="60.0" y="270.0" font-family="Comfortaa" font-weight="400" font-size="25.0" fill="#fffcf3" text-anchor="start" >Sweet corn and spinach sandwich on white and</text><text x="60.0" y="310.0" font-family="Comfortaa" font-weight="400" font-size="25.0" fill="#fffcf3" text-anchor="start" >whole wheat bread, with a mint chutney spread.</text><text x="60.0" y="350.0" font-family="Comfortaa" font-weight="400" font-size="25.0" fill="#fffcf3" text-anchor="start" ></text><text x="60.0" y="390.0" font-family="Comfortaa" font-weight="400" font-size="25.0" fill="#fffcf3" text-anchor="start" >Ingredients: bread (wheat flour, whole wheat flour,</text><text x="60.0" y="430.0" font-family="Comfortaa" font-weight="400" font-size="25.0" fill="#fffcf3" text-anchor="start" >yeast, salt, sugar), sweet corn, spinach, cheese,</text><text x="60.0" y="470.0" font-family="Comfortaa" font-weight="400" font-size="25.0" fill="#fffcf3" text-anchor="start" >mint, coriander, green chilli, butter, spices.</text><text x="60.0" y="510.0" font-family="Comfortaa" font-weight="400" font-size="25.0" fill="#fffcf3" text-anchor="start" ></text><text x="60.0" y="550.0" font-family="Comfortaa" font-weight="400" font-size="25.0" fill="#fffcf3" text-anchor="start" >Keep refrigerated. Best consumed on the day of</text><text x="60.0" y="590.0" font-family="Comfortaa" font-weight="400" font-size="25.0" fill="#fffcf3" text-anchor="start" >your flight.</text></g><g transform="matrix(0,1,-1,0,622.00,0)"><rect x="-40" y="-40" width="780.0" height="1309.6899458456871" fill="#e9692e"/><text x="60.0" y="180.0" font-family="Comfortaa" font-weight="700" font-size="70.0" fill="#fffcf3" text-anchor="start" >Tiffin</text><rect x="570.0" y="118" width="70" height="70" fill="#ffffff"/><rect x="576.3" y="124.3" width="57.4" height="57.4" fill="none" stroke="#0d9447" stroke-width="7.0"/><circle cx="605.0" cy="153.0" r="16.8" fill="#0d9447"/><text x="60.0" y="270.0" font-family="Comfortaa" font-weight="400" font-size="25.0" fill="#fffcf3" text-anchor="start" >Sweet corn and spinach sandwich on white and</text><text x="60.0" y="310.0" font-family="Comfortaa" font-weight="400" font-size="25.0" fill="#fffcf3" text-anchor="start" >whole wheat bread, with a mint chutney spread.</text><text x="60.0" y="350.0" font-family="Comfortaa" font-weight="400" font-size="25.0" fill="#fffcf3" text-anchor="start" ></text><text x="60.0" y="390.0" font-family="Comfortaa" font-weight="400" font-size="25.0" fill="#fffcf3" text-anchor="start" >Ingredients: bread (wheat flour, whole wheat flour,</text><text x="60.0" y="430.0" font-family="Comfortaa" font-weight="400" font-size="25.0" fill="#fffcf3" text-anchor="start" >yeast, salt, sugar), sweet corn, spinach, cheese,</text><text x="60.0" y="470.0" font-family="Comfortaa" font-weight="400" font-size="25.0" fill="#fffcf3" text-anchor="start" >mint, coriander, green chilli, butter, spices.</text><text x="60.0" y="510.0" font-family="Comfortaa" font-weight="400" font-size="25.0" fill="#fffcf3" text-anchor="start" ></text><text x="60.0" y="550.0" font-family="Comfortaa" font-weight="400" font-size="25.0" fill="#fffcf3" text-anchor="start" >Keep refrigerated. Best consumed on the day of</text><text x="60.0" y="590.0" font-family="Comfortaa" font-weight="400" font-size="25.0" fill="#fffcf3" text-anchor="start" >your flight.</text></g><g transform="matrix(0,1,-1,0,1851.69,0)"><svg x="0" y="0" width="700.0" height="1229.6899458456871" overflow="hidden"><rect x="-40" y="-40" width="780.0" height="1309.6899458456871" fill="#e9692e"/><text x="350.0" y="140.0" font-family="Comfortaa" font-weight="400" font-size="88.0" fill="#fffcf3" text-anchor="middle" letter-spacing="-0.5">Easy to digest</text><text x="350.0" y="220.0" font-family="Comfortaa" font-weight="400" font-size="62.0" fill="#fffcf3" text-anchor="middle" >stories</text><rect x="28" y="247" width="644.0" height="6" fill="#fffcf3"/><text x="350.0" y="314.0" font-family="Comfortaa" font-weight="400" font-size="46.0" fill="#fffcf3" text-anchor="middle" >The Ultimate Love Story</text><rect x="28" y="345" width="644.0" height="6" fill="#fffcf3"/><foreignObject x="31" y="375.6" width="641.0" height="854.1199458456872"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Comfortaa;font-weight:400;font-size:25.5px;line-height:40.5px;color:#fffcf3;letter-spacing:-0.1px"><p style="margin:0 0 8.9px 0">Meet Romeo, the bad-boy rebel and Sally, the poor, rich girl. They meet on a huge ship and instantly fall in love. Their love blossoms as they exchange secret love letters through pigeons and dance and sing around trees. But fate has a different plan. A war breaks out and separates them.</p><p style="margin:0 0 8.9px 0">The next time they meet, Sally is betrothed to an oil tycoon and bumps into Romeo, who is a dance instructor in Casablanca. They try to be friends but tempers flare between the two of them. So, they part again.</p><p style="margin:0 0 8.9px 0">One year later, Romeo is on the top of the Empire State Building when he sees a glass slipper on the floor. As he picks it up, he sees Sally standing in front of him and notices that she is missing a shoe and without a fiancé. They both realize that they still love each other. Reunited, the lovers ride off into the sunset.</p></div></foreignObject></svg></g><g transform="matrix(0,-1,1,0,1851.69,700.0)"><svg x="0" y="0" width="700.0" height="1733.1556960826151" overflow="hidden"><rect x="-40" y="-40" width="390.0" height="1813.1556960826151" fill="#95bd43"/><rect x="350.0" y="-40" width="390.0" height="1813.1556960826151" fill="#eea437"/><rect x="-40" y="-40" width="780.0" height="510.0" fill="#264d98"/><rect x="-40" y="1258.1556960826151" width="780.0" height="515.0" fill="#e9692e"/><text x="342.0" y="275" font-family="Comfortaa" font-weight="600" font-size="176" fill="#fffcf3" text-anchor="middle" textLength="560" lengthAdjust="spacingAndGlyphs">IndiGo</text><text x="628.0" y="187.7" font-family="Comfortaa" font-weight="400" font-size="24.0" fill="#fffcf3" text-anchor="start" >®</text><text x="350.0" y="1612.0" font-family="Comfortaa" font-weight="700" font-size="195" fill="#fffcf3" text-anchor="middle" textLength="452" lengthAdjust="spacingAndGlyphs">Tiffin</text></svg></g></svg>