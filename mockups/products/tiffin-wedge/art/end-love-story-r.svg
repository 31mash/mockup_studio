<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 1250" data-width="4096"><rect width="1250.0" height="1250.0" fill="#e9692e"/><text x="1152.0" y="380.0" font-family="Comfortaa" font-weight="400" font-size="24.0" fill="#fffcf3" text-anchor="end" >Follow</text><text x="1152.0" y="415.0" font-family="Comfortaa" font-weight="400" font-size="24.0" fill="#fffcf3" text-anchor="end" >these simple</text><text x="1152.0" y="450.0" font-family="Comfortaa" font-weight="400" font-size="24.0" fill="#fffcf3" text-anchor="end" >stretching exercises to</text><text x="1152.0" y="485.0" font-family="Comfortaa" font-weight="400" font-size="24.0" fill="#fffcf3" text-anchor="end" >enjoy a relaxed flight:</text><rect x="830.0" y="523" width="330" height="3" fill="#fffcf3"/><g transform="translate(1092.0,552.0)"><path d="M6,14 L6,116 M6,76 L66,76 L66,116" fill="none" stroke="#fffcf3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M6,14 L6,116 M6,76 L66,76 L66,116" fill="none" stroke="#e9692e" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" /><circle cx="36" cy="14" r="10" fill="none" stroke="#fffcf3" stroke-width="3.2"/><path d="M36,26 L36,72 M22,34 L50,34 M22,34 L20,66 M50,34 L52,66 M36,72 L62,72 L62,112" fill="none" stroke="#fffcf3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M36,26 L36,72 M22,34 L50,34 M22,34 L20,66 M50,34 L52,66 M36,72 L62,72 L62,112" fill="none" stroke="#e9692e" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" /><path d="M12,36 A10,10 0 0 1 20,24" fill="none" stroke="#fffcf3" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M18.0,29.7 L20.0,24.0 L14.1,24.9" fill="none" stroke="#fffcf3" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M60,36 A10,10 0 0 0 52,24" fill="none" stroke="#fffcf3" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M57.9,24.9 L52.0,24.0 L54.0,29.7" fill="none" stroke="#fffcf3" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1064.0" y="582.0" font-family="Comfortaa" font-weight="400" font-size="24.0" fill="#fffcf3" text-anchor="end" >Rotate your</text><text x="1064.0" y="618.0" font-family="Comfortaa" font-weight="400" font-size="24.0" fill="#fffcf3" text-anchor="end" >shoulders backward</text><text x="1064.0" y="654.0" font-family="Comfortaa" font-weight="400" font-size="24.0" fill="#fffcf3" text-anchor="end" >and forward.</text><g transform="translate(1088.0,716.0)"><circle cx="34" cy="30" r="10" fill="none" stroke="#fffcf3" stroke-width="3.2"/><path d="M34,42 L34,82 L22,116 M34,82 L46,116 M34,50 L22,74" fill="none" stroke="#fffcf3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M34,42 L34,82 L22,116 M34,82 L46,116 M34,50 L22,74" fill="none" stroke="#e9692e" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" /><path d="M34,50 L50,34 C54,24 46,14 34,12" fill="none" stroke="#fffcf3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M34,50 L50,34 C54,24 46,14 34,12" fill="none" stroke="#e9692e" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" /><path d="M14,16 C22,2 50,2 60,14" fill="none" stroke="#fffcf3" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M14.5,9.0 L14.0,16.0 L20.4,13.2" fill="none" stroke="#fffcf3" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M53.4,11.7 L60.0,14.0 L58.9,7.1" fill="none" stroke="#fffcf3" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1064.0" y="746.0" font-family="Comfortaa" font-weight="400" font-size="24.0" fill="#fffcf3" text-anchor="end" >Raise your right arm over your</text><text x="1064.0" y="782.0" font-family="Comfortaa" font-weight="400" font-size="24.0" fill="#fffcf3" text-anchor="end" >head and stretch. Repeat with</text><text x="1064.0" y="818.0" font-family="Comfortaa" font-weight="400" font-size="24.0" fill="#fffcf3" text-anchor="end" >your left arm.</text><g transform="translate(1090.0,876.0)"><circle cx="36" cy="26" r="10" fill="none" stroke="#fffcf3" stroke-width="3.2"/><path d="M36,38 L36,82 L24,116 M36,82 L48,116 M36,46 L20,62 L34,76 M36,46 L52,62 L38,76" fill="none" stroke="#fffcf3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M36,38 L36,82 L24,116 M36,82 L48,116 M36,46 L20,62 L34,76 M36,46 L52,62 L38,76" fill="none" stroke="#e9692e" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" /><path d="M14,20 C14,4 58,4 58,20" fill="none" stroke="#fffcf3" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M11.5,13.5 L14.0,20.0 L18.6,14.7" fill="none" stroke="#fffcf3" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M53.4,14.7 L58.0,20.0 L60.5,13.5" fill="none" stroke="#fffcf3" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1064.0" y="906.0" font-family="Comfortaa" font-weight="400" font-size="24.0" fill="#fffcf3" text-anchor="end" >Rotate your neck</text><text x="1064.0" y="942.0" font-family="Comfortaa" font-weight="400" font-size="24.0" fill="#fffcf3" text-anchor="end" >clockwise and</text><text x="1064.0" y="978.0" font-family="Comfortaa" font-weight="400" font-size="24.0" fill="#fffcf3" text-anchor="end" >anticlockwise.</text><g transform="translate(748.0,876.0)"><path d="M6,20 L6,116 M6,72 L50,72 L50,116" fill="none" stroke="#fffcf3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M6,20 L6,116 M6,72 L50,72 L50,116" fill="none" stroke="#e9692e" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" /><circle cx="28" cy="16" r="10" fill="none" stroke="#fffcf3" stroke-width="3.2"/><path d="M28,28 L28,68 M28,36 L40,58 M28,68 L54,68 L64,100 L74,100" fill="none" stroke="#fffcf3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M28,28 L28,68 M28,36 L40,58 M28,68 L54,68 L64,100 L74,100" fill="none" stroke="#e9692e" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="76" cy="98" rx="11" ry="9" fill="none" stroke="#fffcf3" stroke-width="3"/><path d="M84.4,90.6 L87.0,96.0 L90.5,91.1" fill="none" stroke="#fffcf3" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="722.0" y="906.0" font-family="Comfortaa" font-weight="400" font-size="24.0" fill="#fffcf3" text-anchor="end" >Rotate your left</text><text x="722.0" y="942.0" font-family="Comfortaa" font-weight="400" font-size="24.0" fill="#fffcf3" text-anchor="end" >ankle ten times. Repeat</text><text x="722.0" y="978.0" font-family="Comfortaa" font-weight="400" font-size="24.0" fill="#fffcf3" text-anchor="end" >with your right ankle.</text><path d="M321.3,1188.0 L321.3,1101.1 A44.0,44.0 0 0 1 365.3,1057.1 L359.0,1057.1 A44.0,44.0 0 0 1 403.0,1101.1 L403.0,1188.0 M321.3,1124.6 L403.0,1124.6" fill="none" stroke="#fffcf3" stroke-width="13.38" stroke-linecap="round" stroke-linejoin="round"/><path d="M515.7,1122.5 A39.9,42.5 0 1 0 508.4,1166.9 M441.8,1154.4 L515.7,1122.5" fill="none" stroke="#fffcf3" stroke-width="13.38" stroke-linecap="round" stroke-linejoin="round"/><text x="531.1" y="1188.0" font-family="Comfortaa" font-weight="400" font-size="176.0" fill="#fffcf3" text-anchor="start" >ro-bics</text></svg>