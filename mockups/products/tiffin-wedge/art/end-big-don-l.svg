<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 1250" data-width="4096"><rect width="1250.0" height="1250.0" fill="#e9692e"/><text x="104.0" y="345.0" font-family="Comfortaa" font-weight="400" font-size="22.0" fill="#fffcf3" text-anchor="start" >Follow</text><text x="104.0" y="380.0" font-family="Comfortaa" font-weight="400" font-size="22.0" fill="#fffcf3" text-anchor="start" >these simple</text><text x="104.0" y="415.0" font-family="Comfortaa" font-weight="400" font-size="22.0" fill="#fffcf3" text-anchor="start" >stretching exercises to</text><text x="104.0" y="450.0" font-family="Comfortaa" font-weight="400" font-size="22.0" fill="#fffcf3" text-anchor="start" >enjoy a relaxed flight:</text><rect x="104.0" y="489" width="326" height="3" fill="#fffcf3"/><g transform="translate(92.0,515.0) scale(1.0)"><path d="M6,14 L6,116 M6,76 L66,76 L66,116" fill="none" stroke="#fffcf3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M6,14 L6,116 M6,76 L66,76 L66,116" fill="none" stroke="#e9692e" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" /><circle cx="36" cy="14" r="10" fill="none" stroke="#fffcf3" stroke-width="3.2"/><path d="M36,26 L36,72 M22,34 L50,34 M22,34 L20,66 M50,34 L52,66 M36,72 L62,72 L62,112" fill="none" stroke="#fffcf3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M36,26 L36,72 M22,34 L50,34 M22,34 L20,66 M50,34 L52,66 M36,72 L62,72 L62,112" fill="none" stroke="#e9692e" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" /><path d="M12,36 A10,10 0 0 1 20,24" fill="none" stroke="#fffcf3" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M18.0,29.7 L20.0,24.0 L14.1,24.9" fill="none" stroke="#fffcf3" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M60,36 A10,10 0 0 0 52,24" fill="none" stroke="#fffcf3" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M57.9,24.9 L52.0,24.0 L54.0,29.7" fill="none" stroke="#fffcf3" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="195.0" y="545.0" font-family="Comfortaa" font-weight="400" font-size="24.0" fill="#fffcf3" text-anchor="start" >Rotate your</text><text x="195.0" y="581.0" font-family="Comfortaa" font-weight="400" font-size="24.0" fill="#fffcf3" text-anchor="start" >shoulders backward</text><text x="195.0" y="617.0" font-family="Comfortaa" font-weight="400" font-size="24.0" fill="#fffcf3" text-anchor="start" >and forward.</text><g transform="translate(94.0,682.0) scale(1.0)"><circle cx="34" cy="30" r="10" fill="none" stroke="#fffcf3" stroke-width="3.2"/><path d="M34,42 L34,82 L22,116 M34,82 L46,116 M34,50 L22,74" fill="none" stroke="#fffcf3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M34,42 L34,82 L22,116 M34,82 L46,116 M34,50 L22,74" fill="none" stroke="#e9692e" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" /><path d="M34,50 L50,34 C54,24 46,14 34,12" fill="none" stroke="#fffcf3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M34,50 L50,34 C54,24 46,14 34,12" fill="none" stroke="#e9692e" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" /><path d="M14,16 C22,2 50,2 60,14" fill="none" stroke="#fffcf3" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M14.5,9.0 L14.0,16.0 L20.4,13.2" fill="none" stroke="#fffcf3" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M53.4,11.7 L60.0,14.0 L58.9,7.1" fill="none" stroke="#fffcf3" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="195.0" y="712.0" font-family="Comfortaa" font-weight="400" font-size="24.0" fill="#fffcf3" text-anchor="start" >Raise your right arm over your</text><text x="195.0" y="748.0" font-family="Comfortaa" font-weight="400" font-size="24.0" fill="#fffcf3" text-anchor="start" >head and stretch. Repeat with</text><text x="195.0" y="784.0" font-family="Comfortaa" font-weight="400" font-size="24.0" fill="#fffcf3" text-anchor="start" >your left arm.</text><g transform="translate(92.0,852.0) scale(1.0)"><circle cx="36" cy="26" r="10" fill="none" stroke="#fffcf3" stroke-width="3.2"/><path d="M36,38 L36,82 L24,116 M36,82 L48,116 M36,46 L20,62 L34,76 M36,46 L52,62 L38,76" fill="none" stroke="#fffcf3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M36,38 L36,82 L24,116 M36,82 L48,116 M36,46 L20,62 L34,76 M36,46 L52,62 L38,76" fill="none" stroke="#e9692e" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" /><path d="M14,20 C14,4 58,4 58,20" fill="none" stroke="#fffcf3" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M11.5,13.5 L14.0,20.0 L18.6,14.7" fill="none" stroke="#fffcf3" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M53.4,14.7 L58.0,20.0 L60.5,13.5" fill="none" stroke="#fffcf3" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="195.0" y="882.0" font-family="Comfortaa" font-weight="400" font-size="24.0" fill="#fffcf3" text-anchor="start" >Rotate your neck</text><text x="195.0" y="918.0" font-family="Comfortaa" font-weight="400" font-size="24.0" fill="#fffcf3" text-anchor="start" >clockwise and</text><text x="195.0" y="954.0" font-family="Comfortaa" font-weight="400" font-size="24.0" fill="#fffcf3" text-anchor="start" >anticlockwise.</text><g transform="translate(432.0,852.0) scale(1.0)"><path d="M6,20 L6,116 M6,72 L50,72 L50,116" fill="none" stroke="#fffcf3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M6,20 L6,116 M6,72 L50,72 L50,116" fill="none" stroke="#e9692e" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" /><circle cx="28" cy="16" r="10" fill="none" stroke="#fffcf3" stroke-width="3.2"/><path d="M28,28 L28,68 M28,36 L40,58 M28,68 L54,68 L64,100 L74,100" fill="none" stroke="#fffcf3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M28,28 L28,68 M28,36 L40,58 M28,68 L54,68 L64,100 L74,100" fill="none" stroke="#e9692e" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="76" cy="98" rx="11" ry="9" fill="none" stroke="#fffcf3" stroke-width="3"/><path d="M84.4,90.6 L87.0,96.0 L90.5,91.1" fill="none" stroke="#fffcf3" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="540.0" y="882.0" font-family="Comfortaa" font-weight="400" font-size="24.0" fill="#fffcf3" text-anchor="start" >Rotate your left</text><text x="540.0" y="918.0" font-family="Comfortaa" font-weight="400" font-size="24.0" fill="#fffcf3" text-anchor="start" >ankle ten times. Repeat</text><text x="540.0" y="954.0" font-family="Comfortaa" font-weight="400" font-size="24.0" fill="#fffcf3" text-anchor="start" >with your right ankle.</text><g transform="translate(88.0,1178) scale(1.0,1) translate(-88.0,-1178)"><path d="M108.8,1178.0 L108.8,1091.1 A44.0,44.0 0 0 1 152.8,1047.1 L146.4,1047.1 A44.0,44.0 0 0 1 190.4,1091.1 L190.4,1178.0 M108.8,1114.6 L190.4,1114.6" fill="none" stroke="#fffcf3" stroke-width="13.38" stroke-linecap="round" stroke-linejoin="round"/><path d="M303.2,1112.5 A39.9,42.5 0 1 0 295.8,1156.9 M229.2,1144.4 L303.2,1112.5" fill="none" stroke="#fffcf3" stroke-width="13.38" stroke-linecap="round" stroke-linejoin="round"/><text x="318.6" y="1178.0" font-family="Comfortaa" font-weight="400" font-size="176.0" fill="#fffcf3" text-anchor="start" >ro-bics</text></g></svg>