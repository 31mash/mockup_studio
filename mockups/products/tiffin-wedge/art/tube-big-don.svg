<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4193 700" data-width="12288"><g transform="matrix(0,1,-1,0,4814.53,0)"><rect x="-40" y="-40" width="780.0" height="1309.6899458456871" fill="#5bab5a"/><text x="60.0" y="180.0" font-family="Comfortaa" font-weight="700" font-size="70.0" fill="#fffcf3" text-anchor="start" >Tiffin</text><rect x="570.0" y="118" width="70" height="70" fill="#ffffff"/><rect x="576.3" y="124.3" width="57.4" height="57.4" fill="none" stroke="#0d9447" stroke-width="7.0"/><circle cx="605.0" cy="153.0" r="16.8" fill="#0d9447"/><text x="60.0" y="270.0" font-family="Comfortaa" font-weight="400" font-size="25.0" fill="#fffcf3" text-anchor="start" >Sweet corn and spinach sandwich on white and</text><text x="60.0" y="310.0" font-family="Comfortaa" font-weight="400" font-size="25.0" fill="#fffcf3" text-anchor="start" >whole wheat bread, with a mint chutney spread.</text><text x="60.0" y="350.0" font-family="Comfortaa" font-weight="400" font-size="25.0" fill="#fffcf3" text-anchor="start" ></text><text x="60.0" y="390.0" font-family="Comfortaa" font-weight="400" font-size="25.0" fill="#fffcf3" text-anchor="start" >Ingredients: bread (wheat flour, whole wheat flour,</text><text x="60.0" y="430.0" font-family="Comfortaa" font-weight="400" font-size="25.0" fill="#fffcf3" text-anchor="start" >yeast, salt, sugar), sweet corn, spinach, cheese,</text><text x="60.0" y="470.0" font-family="Comfortaa" font-weight="400" font-size="25.0" fill="#fffcf3" text-anchor="start" >mint, coriander, green chilli, butter, spices.</text><text x="60.0" y="510.0" font-family="Comfortaa" font-weight="400" font-size="25.0" fill="#fffcf3" text-anchor="start" ></text><text x="60.0" y="550.0" font-family="Comfortaa" font-weight="400" font-size="25.0" fill="#fffcf3" text-anchor="start" >Keep refrigerated. Best consumed on the day of</text><text x="60.0" y="590.0" font-family="Comfortaa" font-weight="400" font-size="25.0" fill="#fffcf3" text-anchor="start" >your flight.</text></g><g transform="matrix(0,1,-1,0,622.00,0)"><rect x="-40" y="-40" width="780.0" height="1309.6899458456871" fill="#5bab5a"/><text x="60.0" y="180.0" font-family="Comfortaa" font-weight="700" font-size="70.0" fill="#fffcf3" text-anchor="start" >Tiffin</text><rect x="570.0" y="118" width="70" height="70" fill="#ffffff"/><rect x="576.3" y="124.3" width="57.4" height="57.4" fill="none" stroke="#0d9447" stroke-width="7.0"/><circle cx="605.0" cy="153.0" r="16.8" fill="#0d9447"/><text x="60.0" y="270.0" font-family="Comfortaa" font-weight="400" font-size="25.0" fill="#fffcf3" text-anchor="start" >Sweet corn and spinach sandwich on white and</text><text x="60.0" y="310.0" font-family="Comfortaa" font-weight="400" font-size="25.0" fill="#fffcf3" text-anchor="start" >whole wheat bread, with a mint chutney spread.</text><text x="60.0" y="350.0" font-family="Comfortaa" font-weight="400" font-size="25.0" fill="#fffcf3" text-anchor="start" ></text><text x="60.0" y="390.0" font-family="Comfortaa" font-weight="400" font-size="25.0" fill="#fffcf3" text-anchor="start" >Ingredients: bread (wheat flour, whole wheat flour,</text><text x="60.0" y="430.0" font-family="Comfortaa" font-weight="400" font-size="25.0" fill="#fffcf3" text-anchor="start" >yeast, salt, sugar), sweet corn, spinach, cheese,</text><text x="60.0" y="470.0" font-family="Comfortaa" font-weight="400" font-size="25.0" fill="#fffcf3" text-anchor="start" >mint, coriander, green chilli, butter, spices.</text><text x="60.0" y="510.0" font-family="Comfortaa" font-weight="400" font-size="25.0" fill="#fffcf3" text-anchor="start" ></text><text x="60.0" y="550.0" font-family="Comfortaa" font-weight="400" font-size="25.0" fill="#fffcf3" text-anchor="start" >Keep refrigerated. Best consumed on the day of</text><text x="60.0" y="590.0" font-family="Comfortaa" font-weight="400" font-size="25.0" fill="#fffcf3" text-anchor="start" >your flight.</text></g><g transform="matrix(0,1,-1,0,1851.69,0)"><svg x="0" y="0" width="700.0" height="1229.6899458456871" overflow="hidden"><rect x="-40" y="-40" width="780.0" height="1309.6899458456871" fill="#5bab5a"/><text x="350.0" y="140.0" font-family="Comfortaa" font-weight="400" font-size="88.0" fill="#fffcf3" text-anchor="middle" letter-spacing="-0.5">Easy to digest</text><text x="350.0" y="220.0" font-family="Comfortaa" font-weight="400" font-size="62.0" fill="#fffcf3" text-anchor="middle" >stories</text><rect x="28" y="247" width="644.0" height="6" fill="#fffcf3"/><text x="350.0" y="314.0" font-family="Comfortaa" font-weight="400" font-size="46.0" fill="#fffcf3" text-anchor="middle" >Big Don</text><rect x="28" y="345" width="644.0" height="6" fill="#fffcf3"/><foreignObject x="31" y="373.7" width="641.0" height="855.9799458456871"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Comfortaa;font-weight:400;font-size:26.5px;line-height:43.5px;color:#fffcf3;letter-spacing:-0.1px"><p style="margin:0 0 9.6px 0">Anthony Baba is the Big Don in Mumbai. His kids are Sunny, Chinky, Mintu, Honey and Tushar, a surrogate son. Mintu rejects the family business to become an honest IPS officer.</p><p style="margin:0 0 9.6px 0">Things get messy after a deal with Robert, a gun dealer, goes bad. Baba is shot, a gang-war erupts, Baba’s life is threatened again and Mintu murders Robert and Inspector Ramesh, a corrupt police officer.</p><p style="margin:0 0 9.6px 0">Mintu hides in a village, falls in love and marries a local girl, who gets bumped off by Baba’s enemies.</p><p style="margin:0 0 9.6px 0">Meanwhile, Sunny’s life is cut short and Baba makes peace with the other rival gangs. Then Baba dies in his sleep. Mintu comes back, remarries, takes care of some unfinished business and becomes the new Big Don. Khallas!</p></div></foreignObject></svg></g><g transform="matrix(0,-1,1,0,1851.69,700.0)"><svg x="0" y="0" width="700.0" height="1733.1556960826151" overflow="hidden"><rect x="-40" y="-40" width="390.0" height="1813.1556960826151" fill="#e9692e"/><rect x="350.0" y="-40" width="390.0" height="1813.1556960826151" fill="#eea437"/><rect x="-40" y="-40" width="780.0" height="510.0" fill="#264d98"/><rect x="-40" y="1258.1556960826151" width="780.0" height="515.0" fill="#5bab5a"/><text x="342.0" y="275" font-family="Comfortaa" font-weight="600" font-size="176" fill="#fffcf3" text-anchor="middle" textLength="560" lengthAdjust="spacingAndGlyphs">IndiGo</text><text x="628.0" y="187.7" font-family="Comfortaa" font-weight="400" font-size="24.0" fill="#fffcf3" text-anchor="start" >®</text><text x="350.0" y="1612.0" font-family="Comfortaa" font-weight="700" font-size="195" fill="#fffcf3" text-anchor="middle" textLength="452" lengthAdjust="spacingAndGlyphs">Tiffin</text></svg></g></svg>